# Docker Compose for production deployment
version: '3.8'

services:
  # Redis for Celery and caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # PostgreSQL database (using external database in production, this is for backup/testing)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # FastAPI web service
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GOOGLE_API_KEY_IMAGE=${GOOGLE_API_KEY_IMAGE}
      - GOOGLE_API_KEY_AUDIO=${GOOGLE_API_KEY_AUDIO}
      - GOOGLE_API_KEY_TEXT=${GOOGLE_API_KEY_TEXT}
      - GOOGLE_API_KEY_REPORT=${GOOGLE_API_KEY_REPORT}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    volumes:
      - static_data:/app/static
      - upload_data:/app/uploads
    depends_on:
      - redis
    restart: unless-stopped
    command: gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

  # Celery worker
  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GOOGLE_API_KEY_IMAGE=${GOOGLE_API_KEY_IMAGE}
      - GOOGLE_API_KEY_AUDIO=${GOOGLE_API_KEY_AUDIO}
      - GOOGLE_API_KEY_TEXT=${GOOGLE_API_KEY_TEXT}
      - GOOGLE_API_KEY_REPORT=${GOOGLE_API_KEY_REPORT}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    volumes:
      - static_data:/app/static
      - upload_data:/app/uploads
    depends_on:
      - redis
    restart: unless-stopped
    command: celery -A fixmyhyd.tasks.celery_app worker --loglevel=info --concurrency=4

  # Telegram bot worker
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - PORTAL_BASE_URL=${PORTAL_BASE_URL}
      - DEBUG=false
    volumes:
      - .:/app
    depends_on:
      - web
    restart: unless-stopped
    command: python bot.py

  # Celery Flower (monitoring)
  flower:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
    restart: unless-stopped
    command: celery -A fixmyhyd.tasks.celery_app flower --port=5555

volumes:
  postgres_data:
  redis_data:
  static_data:
  upload_data:
