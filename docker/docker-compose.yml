# Docker Compose for local development
version: '3.8'

services:
  # Redis for Celery and caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: fixmyhyd
      POSTGRES_USER: fixmyhyd
      POSTGRES_PASSWORD: fixmyhyd_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixmyhyd"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI web service
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://fixmyhyd:fixmyhyd_dev@postgres:5432/fixmyhyd
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DEBUG=true
    volumes:
      - ../:/app
      - static_data:/app/static
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Celery worker
  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
    environment:
      - DATABASE_URL=postgresql://fixmyhyd:fixmyhyd_dev@postgres:5432/fixmyhyd
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DEBUG=true
    volumes:
      - ../:/app
      - static_data:/app/static
      - upload_data:/app/uploads
    depends_on:
      - redis
      - postgres
    command: celery -A fixmyhyd.tasks.celery_app worker --loglevel=info --concurrency=2

  # Telegram bot worker
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - PORTAL_BASE_URL=http://web:8000
      - DEBUG=true
    volumes:
      - ../:/app
    depends_on:
      - web
    command: python bot.py

  # Celery Flower (monitoring)
  flower:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
    command: celery -A fixmyhyd.tasks.celery_app flower --port=5555

volumes:
  postgres_data:
  redis_data:
  static_data:
  upload_data:
